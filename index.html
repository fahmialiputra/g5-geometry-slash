<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Slash v3.0</title>
    <style>
        /* CSS SETUP */
        :root {
            --primary: #00ffcc;
            --secondary: #ff0055;
            --warning: #ffaa00;
            --good: #00ff55;
            --bg: #111;
            --glass: rgba(255, 255, 255, 0.1);
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg);
            font-family: var(--font-main);
            color: white;
            width: 100vw;
            height: 100vh;
        }

        /* SCREEN EFFECTS (Flash Frame) */
        #screen-fx {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
            box-shadow: inset 0 0 0px transparent;
            transition: box-shadow 0.2s;
        }
        
        .fx-buff { animation: pulseFrame 1s infinite; }
        
        @keyframes pulseFrame {
            0% { box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.1); }
            50% { box-shadow: inset 0 0 100px var(--fx-color); }
            100% { box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.1); }
        }

        /* UI LAYERS */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: radial-gradient(circle, #222 0%, #000 100%);
            transition: opacity 0.5s;
            z-index: 10;
        }

        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 4rem;
            text-transform: uppercase;
            text-shadow: 0 0 20px var(--primary);
            margin-bottom: 20px;
            text-align: center;
        }

        /* BUTTONS */
        .btn {
            background: var(--glass);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 15px 40px;
            font-size: 1.5rem;
            margin: 10px;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        .btn:hover, .btn:active {
            background: var(--primary); color: #000;
            box-shadow: 0 0 30px var(--primary);
        }

        .btn-small { padding: 8px 15px; font-size: 1rem; }

        /* HEADER CONTROLS */
        .header-controls {
            position: absolute; top: 20px; right: 20px;
            display: flex; gap: 10px; z-index: 100;
        }
        
        .game-controls {
            position: absolute; top: 20px; left: 20px;
            z-index: 100;
        }

        .icon-btn {
            background: rgba(0,0,0,0.5);
            border: 1px solid white; color: white;
            width: 50px; height: 50px;
            border-radius: 50%; font-size: 24px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        
        .btn-abort {
            border-color: var(--secondary);
            color: var(--secondary);
            font-weight: bold;
        }
        .btn-abort:hover { background: var(--secondary); color: white; }

        /* MODALS */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex; justify-content: center; align-items: center;
            z-index: 50; backdrop-filter: blur(5px);
        }

        .modal-content {
            background: #222; border: 2px solid var(--secondary);
            padding: 30px; border-radius: 15px;
            width: 90%; max-width: 500px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.3);
            max-height: 90vh; overflow-y: auto;
        }

        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #aaa; }
        input[type="range"] { width: 100%; accent-color: var(--secondary); }
        input[type="text"] { width: 100%; padding: 10px; font-size: 1.2rem; background: #333; border: none; color: white; border-radius: 5px; text-align: center; }

        /* LEADERBOARD */
        .leaderboard-container {
            margin-top: 20px; width: 100%; max-width: 600px;
            background: rgba(255,255,255,0.05); padding: 10px;
            border-radius: 10px;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #444; }
        th { color: var(--primary); }

        /* HUD */
        #hud {
            position: absolute; top: 80px; left: 20px; /* Turun sedikit karena ada tombol abort */
            font-size: 1.5rem; pointer-events: none;
            z-index: 20; text-shadow: 1px 1px 2px black;
            display: flex; flex-direction: column; gap: 5px;
        }

        #hud-lives { color: var(--secondary); font-size: 1.8rem; letter-spacing: 5px; }
        #hud-active-buffs { display: flex; gap: 10px; margin-top: 5px; }
        
        .buff-badge {
            background: rgba(0,0,0,0.7); border: 1px solid white;
            padding: 5px 10px; border-radius: 5px; font-size: 1rem;
            animation: popIn 0.3s;
        }
        
        #boss-warning {
            position: absolute; top: 20%; width: 100%; text-align: center;
            font-size: 3rem; color: yellow; font-weight: bold;
            text-shadow: 0 0 20px red; pointer-events: none;
            animation: blink 0.5s infinite;
            display: none; z-index: 25;
        }

        /* CANVAS */
        canvas { position: absolute; top: 0; left: 0; z-index: 1; }

        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        @media (max-width: 768px) { h1 { font-size: 2.5rem; } .btn { font-size: 1.2rem; padding: 12px 30px; } }
    </style>
</head>
<body>

    <div id="screen-fx"></div>

    <div class="header-controls">
        <button class="icon-btn" onclick="toggleSettings()">⚙️</button>
        <button class="icon-btn" onclick="toggleFullScreen()">⛶</button>
    </div>

    <div id="screen-title" class="screen" onclick="showMainMenu()">
        <h1>Geometry<br><span style="color:var(--secondary)">Slash</span></h1>
        <p style="animation: pulse 1s infinite">Ketuk Layar Untuk Mulai</p>
    </div>

    <div id="screen-menu" class="screen hidden">
        <h1>Menu Utama</h1>
        <button class="btn" onclick="prepareGame('time_trial')">Time Trial</button>
        <button class="btn" onclick="prepareGame('geometry_run')">Geometry Run</button>
        
        <div class="leaderboard-container">
            <h3>🏆 Leaderboard Top 3</h3>
            <div style="display:flex; justify-content:space-around;">
                <button class="btn-small" onclick="showLeaderboard('time_trial')">Time Trial</button>
                <button class="btn-small" onclick="showLeaderboard('geometry_run')">Geo Run</button>
            </div>
            <table id="mini-leaderboard"></table>
        </div>
    </div>

    <div id="modal-name" class="modal hidden">
        <div class="modal-content">
            <h2>Masukkan Nama</h2>
            <input type="text" id="player-name" placeholder="Nama Pemain" maxlength="10">
            <br><br>
            <button class="btn" onclick="startGame()">MULAI!</button>
            <button class="btn btn-small" style="background:transparent; border:none; color: #888;" onclick="closeNameModal()">Batal</button>
        </div>
    </div>

    <div id="modal-settings" class="modal hidden">
        <div class="modal-content">
            <h2>Pengaturan</h2>
            <div class="form-group">
                <label>Tingkat Kesulitan: <span id="val-diff">2</span>⭐</label>
                <input type="range" id="cfg-difficulty" min="1" max="5" value="2" oninput="updateSettingsUI()">
            </div>
            <div class="form-group">
                <label>Timer Time Trial (Menit): <span id="val-time">5</span></label>
                <input type="range" id="cfg-timer" min="1" max="15" value="5" oninput="updateSettingsUI()">
            </div>
            <div class="form-group">
                <label>Target Shape (Geo Run): <span id="val-shape">10</span></label>
                <input type="range" id="cfg-shape" min="5" max="30" value="10" oninput="updateSettingsUI()">
            </div>
            <hr style="border-color:#444">
            <div style="display:flex; gap:5px; flex-wrap:wrap; justify-content:center;">
                <button class="btn-small" onclick="exportData()">Eksport Data</button>
                <button class="btn-small" onclick="importData()">Import Data</button>
                <button class="btn-small" style="border-color:red; color:red" onclick="resetData()">Reset Data</button>
            </div>
            <br>
            <button class="btn" onclick="toggleSettings()">Tutup</button>
        </div>
    </div>

    <div id="screen-gameover" class="screen hidden">
        <h1 style="color:var(--secondary)">Permainan Selesai!</h1>
        <h2 id="final-score">Skor: 0</h2>
        <p id="final-detail"></p>
        <button class="btn" onclick="goToMenu()">Kembali ke Menu</button>
    </div>

    <div id="game-layer" class="hidden">
        <div class="game-controls">
            <button class="icon-btn btn-abort" onclick="abortGame()">✖</button>
        </div>

        <div id="hud">
            <div id="hud-score">Skor: 0</div>
            <div id="hud-timer">Waktu: 00:00</div>
            <div id="hud-target" style="display:none; color: var(--primary)">Target: 0</div>
            <div id="hud-lives">❤️❤️❤️</div>
            <div id="hud-active-buffs"></div>
        </div>
        <div id="boss-warning">⚠️ FINAL TARGET ⚠️</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        // --- KONFIGURASI GLOBAL ---
        const config = {
            difficulty: 2,
            timerDuration: 5,
            targetShapes: 10,
            playerName: "Player"
        };

        // --- STATE VARIABLES ---
        let gameState = 'title';
        let gameMode = '';
        
        let score = 0;
        let lives = 3;
        const maxLives = 5;
        
        let timeRemaining = 0;
        let timeElapsed = 0;
        let shapesDestroyed = 0;
        
        // Logic Variables
        let shapes = [];
        let particles = [];
        let mousePath = [];
        let lastTime = 0;
        let spawnTimer = 0;
        let isMouseDown = false;
        let globalSpeed = 1.0; 
        
        // Effects & Boss
        let scoreMultiplier = 1;
        let multiplierTimer = 0;
        let slowMoTimer = 0;
        let immunityTimer = 0;
        let fxTimer = 0; // Timer untuk screen flash
        
        // Boss Logic
        let bossSpawned = false;
        let bossActive = false;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- MANAJEMEN DATA ---
        const DB_KEY = 'geo_slash_db_v3';
        let leaderboardData = { time_trial: [], geometry_run: [] };

        function loadData() {
            const saved = localStorage.getItem(DB_KEY);
            if(saved) leaderboardData = JSON.parse(saved);
        }
        function saveData() { localStorage.setItem(DB_KEY, JSON.stringify(leaderboardData)); }
        function resetData() {
            if(confirm("Hapus leaderboard?")) {
                leaderboardData = { time_trial: [], geometry_run: [] };
                saveData();
                showMainMenu();
            }
        }
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(leaderboardData));
            const node = document.createElement('a');
            node.setAttribute("href", dataStr);
            node.setAttribute("download", "geoslash_save.json");
            document.body.appendChild(node);
            node.click();
            node.remove();
        }
        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = re => {
                    try {
                        leaderboardData = JSON.parse(re.target.result);
                        saveData();
                        alert("Berhasil import!");
                        updateSettingsUI();
                    } catch (err) { alert("File error."); }
                }
                reader.readAsText(file);
            }
            input.click();
        }

        // --- UI NAVIGATION ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('modal-name').classList.add('hidden');
            document.getElementById('game-layer').classList.add('hidden');
            const target = document.getElementById(id);
            if(target) target.classList.remove('hidden');
        }

        function showMainMenu() {
            gameState = 'menu';
            showScreen('screen-menu');
            showLeaderboard('time_trial');
            clearScreenEffect();
        }

        function toggleSettings() {
            document.getElementById('modal-settings').classList.toggle('hidden');
            updateSettingsUI();
        }

        function updateSettingsUI() {
            document.getElementById('val-diff').innerText = document.getElementById('cfg-difficulty').value;
            document.getElementById('val-time').innerText = document.getElementById('cfg-timer').value;
            document.getElementById('val-shape').innerText = document.getElementById('cfg-shape').value;
            config.difficulty = parseInt(document.getElementById('cfg-difficulty').value);
            config.timerDuration = parseInt(document.getElementById('cfg-timer').value);
            config.targetShapes = parseInt(document.getElementById('cfg-shape').value);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        function prepareGame(mode) {
            gameMode = mode;
            document.getElementById('player-name').value = config.playerName;
            document.getElementById('modal-name').classList.remove('hidden');
        }

        function closeNameModal() { document.getElementById('modal-name').classList.add('hidden'); }

        function showLeaderboard(mode) {
            const table = document.getElementById('mini-leaderboard');
            const data = leaderboardData[mode] || [];
            if(mode === 'time_trial') data.sort((a,b) => b.score - a.score);
            else data.sort((a,b) => a.timeElapsed - b.timeElapsed || b.score - a.score);

            let html = `<tr><th>Rank</th><th>Nama</th><th>${mode === 'time_trial' ? 'Skor' : 'Waktu'}</th></tr>`;
            data.slice(0, 3).forEach((d, i) => {
                let val = mode === 'time_trial' ? d.score : formatTime(d.timeElapsed);
                html += `<tr><td>#${i+1}</td><td>${d.name}</td><td>${val}</td></tr>`;
            });
            if(data.length === 0) html += `<tr><td colspan="3" style="text-align:center">Kosong</td></tr>`;
            table.innerHTML = html;
        }

        // --- VISUAL EFFECTS ---
        function triggerScreenEffect(color) {
            const fx = document.getElementById('screen-fx');
            fx.style.setProperty('--fx-color', color);
            fx.classList.add('fx-buff');
            fxTimer = 2.0; // 2 detik kedip
        }

        function clearScreenEffect() {
            const fx = document.getElementById('screen-fx');
            fx.classList.remove('fx-buff');
        }

        // --- GAME LOGIC ---

        class Shape {
            constructor(forceType = null) {
                this.size = Math.random() * 30 + 30; 
                this.x = Math.random() * (canvas.width - 100) + 50;
                this.y = canvas.height + this.size;
                
                const diffMult = 1 + (config.difficulty * 0.2);
                this.vx = (Math.random() - 0.5) * 4 * diffMult;
                this.vy = -(Math.random() * 5 + 10 + config.difficulty); 
                this.gravity = 0.2;
                this.rotation = 0;
                this.rotSpeed = (Math.random() - 0.5) * 0.2;
                
                this.active = true;
                
                if (forceType) {
                    this.type = forceType;
                    this.setupBoss();
                } else {
                    this.determineType();
                }
            }

            setupBoss() {
                // SPECIAL BOSS GEOMETRY: THE GOLDEN PRISM
                this.size = 100; // Lebih besar
                this.color = '#FFD700'; // Gold
                this.vy = -18; // Lempar tinggi
                this.vx = 0;
                this.gravity = 0.1; // Jatuh lambat
                this.rotSpeed = 0.05;
            }

            determineType() {
                const rand = Math.random();
                if (rand < 0.70) {
                    this.type = 'normal';
                    this.subType = Math.floor(Math.random() * 4); 
                    this.color = `hsl(${Math.random()*360}, 70%, 50%)`;
                    if(this.subType === 3) this.createIrregularVertices();
                } else if (rand < 0.85) {
                    this.type = 'bomb'; this.color = '#333';
                } else if (rand < 0.90) {
                    this.type = 'score_up'; this.color = '#00ff55';
                } else if (rand < 0.94) {
                    this.type = 'multiplier'; this.multVal = Math.random() > 0.5 ? 3 : 2; this.color = '#ffaa00';
                } else if (rand < 0.98) {
                    this.type = 'slow_mo'; this.color = '#00ccff';
                } else {
                    if (gameMode === 'geometry_run') { this.type = 'life'; this.color = '#ff0055'; }
                    else { this.type = 'normal'; this.subType = 2; this.color = 'white'; }
                }
            }

            createIrregularVertices() {
                this.vertices = [];
                const sides = Math.floor(Math.random() * 3) + 5;
                for(let i=0; i<sides; i++) {
                    const angle = (Math.PI * 2 * i) / sides;
                    const r = this.size * (0.5 + Math.random()*0.5);
                    this.vertices.push({x: Math.cos(angle)*r, y: Math.sin(angle)*r});
                }
            }

            update(dt) {
                let currentSpeed = globalSpeed; 
                this.x += this.vx * currentSpeed;
                this.y += this.vy * currentSpeed;
                this.vy += this.gravity * currentSpeed;
                this.rotation += this.rotSpeed * currentSpeed;

                if (this.y > canvas.height + this.size + 50) this.active = false;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#fff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;

                ctx.beginPath();

                if (this.type === 'boss') {
                    // THE GOLDEN PRISM (Star/Diamond Shape)
                    const spikes = 5;
                    const outerRadius = this.size / 2;
                    const innerRadius = this.size / 4;
                    
                    let rot = Math.PI / 2 * 3;
                    let x = 0; let y = 0;
                    let step = Math.PI / spikes;

                    ctx.moveTo(0, 0 - outerRadius);
                    for (let i = 0; i < spikes; i++) {
                        x = 0; y = 0 - outerRadius; // start top
                        ctx.lineTo(Math.cos(rot) * outerRadius, Math.sin(rot) * outerRadius);
                        rot += step;
                        ctx.lineTo(Math.cos(rot) * innerRadius, Math.sin(rot) * innerRadius);
                        rot += step;
                    }
                    ctx.lineTo(0, 0 - outerRadius);
                    ctx.closePath();
                    
                    ctx.fillStyle = ctx.createRadialGradient(0,0,5, 0,0,this.size);
                    ctx.fillStyle.addColorStop(0, "white");
                    ctx.fillStyle.addColorStop(1, "gold");
                    ctx.fill();
                    ctx.stroke();
                    
                } else if (this.type === 'normal') {
                    if (this.subType === 0) ctx.rect(-this.size/2, -this.size/2, this.size, this.size);
                    else if (this.subType === 1) { ctx.moveTo(0, -this.size/2); ctx.lineTo(this.size/2, this.size/2); ctx.lineTo(-this.size/2, this.size/2); }
                    else if (this.subType === 2) ctx.arc(0, 0, this.size/2, 0, Math.PI*2);
                    else if (this.subType === 3) { ctx.moveTo(this.vertices[0].x, this.vertices[0].y); this.vertices.forEach(v => ctx.lineTo(v.x, v.y)); }
                    ctx.fill(); ctx.stroke();
                } else if (this.type === 'bomb') {
                    ctx.fillStyle = '#111'; ctx.arc(0,0, this.size/2, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(-10, -5, 5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(10, -5, 5, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'red'; ctx.font = "bold 20px Arial"; ctx.textAlign = "center"; ctx.fillText("X", 0, 15);
                } else if (this.type === 'score_up') {
                    ctx.fillStyle = '#0f5'; ctx.fillRect(-10, -this.size/2, 20, this.size); ctx.fillRect(-this.size/2, -10, this.size, 20); ctx.strokeRect(-10, -this.size/2, 20, this.size);
                } else if (this.type === 'multiplier') {
                    ctx.fillStyle = '#fa0'; ctx.font = "bold 40px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText(`x${this.multVal}`, 0, 0); ctx.lineWidth = 1; ctx.strokeText(`x${this.multVal}`, 0, 0);
                } else if (this.type === 'slow_mo') {
                    ctx.fillStyle = '#0cf'; const sides = 6; ctx.moveTo(this.size/2, 0);
                    for (let i = 1; i <= sides; i++) ctx.lineTo(this.size/2 * Math.cos(i * 2 * Math.PI / sides), this.size/2 * Math.sin(i * 2 * Math.PI / sides));
                    ctx.fill(); ctx.stroke(); ctx.fillStyle = "white"; ctx.font = "bold 20px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("SLOW", 0, 0);
                } else if (this.type === 'life') {
                    ctx.fillStyle = '#f05'; const top = this.size * 0.3; ctx.moveTo(0, top);
                    ctx.bezierCurveTo(0, 0, -this.size/2, 0, -this.size/2, top); ctx.bezierCurveTo(-this.size/2, (this.size + top)/2, 0, (this.size + top)/2, 0, this.size);
                    ctx.bezierCurveTo(0, (this.size + top)/2, this.size/2, (this.size + top)/2, this.size/2, top); ctx.bezierCurveTo(this.size/2, 0, 0, 0, 0, top);
                    ctx.fill(); ctx.stroke();
                }

                ctx.restore();
            }

            checkHit(x, y) {
                const dx = this.x - x; const dy = this.y - y;
                return Math.sqrt(dx*dx + dy*dy) < this.size/2 + 15;
            }
        }

        // --- GAME LOOP & LOGIC ---
        function startGame() {
            const nameInput = document.getElementById('player-name').value.trim();
            if(!nameInput) { alert("Masukkan nama!"); return; }
            config.playerName = nameInput;

            closeNameModal();
            showScreen('game-layer');
            document.getElementById('game-layer').classList.remove('hidden');

            // Reset Vars
            score = 0; lives = 3; shapes = []; particles = []; mousePath = [];
            shapesDestroyed = 0; timeElapsed = 0; gameState = 'playing';
            
            // Effect Reset
            scoreMultiplier = 1; multiplierTimer = 0; globalSpeed = 1.0;
            slowMoTimer = 0; immunityTimer = 0; fxTimer = 0;
            
            // Boss Reset
            bossSpawned = false; bossActive = false;
            document.getElementById('boss-warning').style.display = 'none';

            if(gameMode === 'time_trial') {
                timeRemaining = config.timerDuration * 60;
                document.getElementById('hud-target').style.display = 'none';
            } else {
                timeRemaining = 0;
                document.getElementById('hud-target').style.display = 'block';
            }

            clearScreenEffect();
            updateHUD();
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        // FEATURE 1: ABORT GAME
        function abortGame() {
            if(confirm("Yakin ingin keluar? Skor tidak akan disimpan.")) {
                gameState = 'menu';
                clearScreenEffect();
                showMainMenu();
            }
        }

        function gameLoop(timestamp) {
            if(gameState !== 'playing') return;

            const rawDt = timestamp - lastTime;
            lastTime = timestamp;
            const dt = rawDt; 
            const dtSeconds = dt / 1000;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. UPDATE TIMERS & EFFECTS
            if(gameMode === 'time_trial') {
                timeRemaining -= dtSeconds;
                if(timeRemaining <= 0) endGame();
            } else {
                timeElapsed += dtSeconds;
            }

            if (multiplierTimer > 0) { multiplierTimer -= dtSeconds; if(multiplierTimer <= 0) scoreMultiplier = 1; }
            if (slowMoTimer > 0) { slowMoTimer -= dtSeconds; globalSpeed = 0.3; } else { globalSpeed = 1.0; }
            if (immunityTimer > 0) immunityTimer -= dtSeconds;
            
            // Handle FX Flash Duration
            if (fxTimer > 0) {
                fxTimer -= dtSeconds;
                if(fxTimer <= 0) clearScreenEffect();
            }

            // 2. SPAWN LOGIC
            let currentSpawnRate = (2000 - (config.difficulty * 300));
            if (globalSpeed < 1.0) currentSpawnRate = 300; 

            // LOGIKA GEOMETRY RUN BOSS
            if (gameMode === 'geometry_run' && shapesDestroyed >= config.targetShapes) {
                // Target terpenuhi, hentikan spawn normal, spawn BOSS
                if (!bossSpawned) {
                    // Tampilkan Warning
                    document.getElementById('boss-warning').style.display = 'block';
                    
                    // Delay spawn boss sedikit
                    setTimeout(() => {
                        shapes.push(new Shape('boss'));
                        bossActive = true;
                    }, 2000);
                    
                    bossSpawned = true;
                }
                // Jangan kurangi spawnTimer, stop spawning normal
            } else {
                // Normal Spawn
                spawnTimer -= rawDt;
                if(spawnTimer <= 0) {
                    shapes.push(new Shape());
                    spawnTimer = currentSpawnRate;
                }
            }

            // 3. UPDATE OBJECTS
            for (let i = shapes.length - 1; i >= 0; i--) {
                shapes[i].update(dt);
                shapes[i].draw(ctx);
                
                // Jika Boss jatuh tanpa terpotong, reset posisinya (boss tidak boleh hilang)
                if (shapes[i].type === 'boss' && !shapes[i].active) {
                     shapes[i].active = true;
                     shapes[i].y = canvas.height;
                     shapes[i].vy = -18; // Lempar lagi
                }
                
                if (!shapes[i].active) shapes.splice(i, 1);
            }

            // Trail
            if (mousePath.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = immunityTimer > 0 ? '#ffff00' : 'white';
                ctx.lineWidth = 5; ctx.lineCap = 'round';
                ctx.shadowBlur = 20; ctx.shadowColor = '#00ffcc';
                ctx.moveTo(mousePath[0].x, mousePath[0].y);
                for (let i = 1; i < mousePath.length; i++) ctx.lineTo(mousePath[i].x, mousePath[i].y);
                ctx.stroke();
                if(mousePath.length > 10) mousePath.shift();
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(); particles[i].draw(ctx);
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            updateHUD();
            requestAnimationFrame(gameLoop);
        }

        function handleSlash(x, y) {
            for (let i = shapes.length - 1; i >= 0; i--) {
                if(shapes[i].checkHit(x, y)) {
                    const s = shapes[i];
                    createExplosion(s.x, s.y, s.color);
                    
                    // Logic Hit
                    if (s.type === 'boss') {
                        // FEATURE 3: BOSS DEFEATED
                        addScore(1000);
                        shapes.splice(i, 1);
                        endGame(); // Win Geometry Run
                        return;
                    }

                    switch(s.type) {
                        case 'normal':
                            addScore(10); shapesDestroyed++;
                            // Cek boss spawn logic di gameLoop
                            break;
                        
                        case 'bomb':
                            if (immunityTimer <= 0) {
                                lives--; createExplosion(s.x, s.y, 'red');
                                triggerScreenEffect('red'); // Flash Merah
                            }
                            break;

                        case 'score_up':
                            addScore(50);
                            triggerScreenEffect('#00ff55'); // FEATURE 2: Flash Hijau
                            break;
                        
                        case 'multiplier':
                            scoreMultiplier = s.multVal; multiplierTimer = 10;
                            triggerScreenEffect('#ffaa00'); // FEATURE 2: Flash Orange
                            break;

                        case 'slow_mo':
                            slowMoTimer = 5;
                            triggerScreenEffect('#00ccff'); // FEATURE 2: Flash Biru
                            break;

                        case 'life':
                            triggerScreenEffect('#ff0055'); // Flash Pink
                            if (lives < maxLives) lives++;
                            else immunityTimer = 10;
                            break;
                    }

                    if(s.type !== 'boss') shapes.splice(i, 1);
                    if (lives <= 0) endGame();
                }
            }
        }

        function createExplosion(x, y, color) {
            for(let i=0; i<10; i++) particles.push(new Particle(x, y, color));
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.vx = (Math.random()-0.5)*10; this.vy = (Math.random()-0.5)*10;
                this.life = 1.0; this.color = color;
            }
            update() { this.x += this.vx; this.y += this.vy; this.life -= 0.05; }
            draw(ctx) { ctx.globalAlpha = this.life; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x,this.y,3,0,Math.PI*2); ctx.fill(); ctx.globalAlpha = 1.0; }
        }

        function addScore(base) { score += Math.floor(base * scoreMultiplier * config.difficulty); }

        function updateHUD() {
            document.getElementById('hud-score').innerText = `Skor: ${score}`;
            if(gameMode === 'time_trial') document.getElementById('hud-timer').innerText = formatTime(timeRemaining);
            else {
                document.getElementById('hud-timer').innerText = formatTime(timeElapsed);
                // Jika target tercapai, ubah teks menjadi BOSS
                const remaining = Math.max(0, config.targetShapes - shapesDestroyed);
                document.getElementById('hud-target').innerText = remaining === 0 ? "TARGET: BOSS!" : `Target: ${remaining}`;
            }

            let hearts = ""; for(let i=0; i<lives; i++) hearts += "❤️";
            document.getElementById('hud-lives').innerHTML = hearts;

            let buffsHtml = "";
            if (immunityTimer > 0) buffsHtml += `<div class="buff-badge" style="color:yellow; border-color:yellow;">🛡️ Kebal (${Math.ceil(immunityTimer)}s)</div>`;
            if (multiplierTimer > 0) buffsHtml += `<div class="buff-badge" style="color:orange; border-color:orange;">⚡ x${scoreMultiplier} (${Math.ceil(multiplierTimer)}s)</div>`;
            if (slowMoTimer > 0) buffsHtml += `<div class="buff-badge" style="color:#0cf; border-color:#0cf;">❄️ Slow (${Math.ceil(slowMoTimer)}s)</div>`;
            document.getElementById('hud-active-buffs').innerHTML = buffsHtml;
        }

        function formatTime(seconds) {
            if(seconds < 0) seconds = 0;
            const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        function endGame() {
            gameState = 'gameover';
            clearScreenEffect();
            document.getElementById('boss-warning').style.display = 'none';
            showScreen('screen-gameover');
            
            document.getElementById('final-score').innerText = `Skor Akhir: ${score}`;
            let detail = gameMode === 'geometry_run' ? `Waktu: ${formatTime(timeElapsed)}` : `Mode Time Trial Selesai`;
            if (lives <= 0) detail += " (Mati)";
            else if (gameMode === 'geometry_run' && bossSpawned) detail += " (Boss Terkalahkan!)";
            
            document.getElementById('final-detail').innerText = detail;

            const newEntry = { name: config.playerName, score: score, timeElapsed: timeElapsed, date: new Date().toISOString() };
            leaderboardData[gameMode].push(newEntry);
            saveData();
        }

        function goToMenu() { showMainMenu(); }

        // --- INPUT HANDLING ---
        function addInputPoint(x, y) { mousePath.push({x, y}); handleSlash(x, y); }
        window.addEventListener('mousedown', () => { isMouseDown = true; mousePath = []; });
        window.addEventListener('mouseup', () => { isMouseDown = false; mousePath = []; });
        window.addEventListener('mousemove', (e) => { if(isMouseDown && gameState === 'playing') addInputPoint(e.clientX, e.clientY); });
        
        window.addEventListener('touchstart', (e) => { isMouseDown = true; mousePath = []; }, {passive: false});
        window.addEventListener('touchend', () => { isMouseDown = false; mousePath = []; });
        window.addEventListener('touchmove', (e) => {
            if(isMouseDown && gameState === 'playing') { e.preventDefault(); const touch = e.touches[0]; addInputPoint(touch.clientX, touch.clientY); }
        }, {passive: false});

        loadData();
    </script>
</body>
</html>
