<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Slash v3.1 - Multiplayer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-controls">
        <button class="icon-btn" onclick="toggleSettings()">⚙️</button>
        <button class="icon-btn" onclick="toggleFullScreen()">⛶</button>
    </div>

    <div id="screen-title" class="screen" onclick="showMainMenu()">
        <h1>Geometry<br><span style="color:var(--secondary)">Slash</span></h1>
        <p class="pulse-text">Ketuk Layar Untuk Mulai</p>
    </div>

    <div id="screen-menu" class="screen hidden">
        <h1>Menu Utama</h1>
        <div class="menu-buttons">
            <button class="btn" onclick="openMultiplayerSetup('time_trial')">Time Trial</button>
            <button class="btn" onclick="openMultiplayerSetup('geometry_run')">Geometry Run</button>
        </div>
        
        <div class="leaderboard-container">
            <div class="leaderboard-header">
                <h3>🏆 Top 
                    <select id="lb-limit" onchange="showLeaderboard(currentLbMode)" class="modern-select">
                        <option value="20">20</option>
                        <option value="40">40</option>
                        <option value="60">60</option>
                        <option value="80">80</option>
                        <option value="100">100</option>
                    </select>
                </h3>
                <div class="leaderboard-tabs">
                    <button class="btn-small btn-confirm" id="tab-tt" onclick="showLeaderboard('time_trial')">Time Trial</button>
                    <button class="btn-small btn-confirm" id="tab-gr" onclick="showLeaderboard('geometry_run')">Geo Run</button>
                </div>
            </div>
            <div class="table-scroll">
                <table id="mini-leaderboard"></table>
            </div>
        </div>
    </div>

    <div id="modal-setup" class="modal hidden">
        <div class="modal-content compact">
            <h2>Setup Pemain</h2>
            <div class="player-count-selector">
                <button type="button" class="btn-count active" onclick="setPlayerCount(1)">1P</button>
                <button type="button" class="btn-count" onclick="setPlayerCount(2)">2P</button>
                <button type="button" class="btn-count" onclick="setPlayerCount(3)">3P</button>
                <button type="button" class="btn-count" onclick="setPlayerCount(4)">4P</button>
            </div>
            <input type="hidden" id="num-players" value="1">
            
            <div id="player-inputs-container" class="scrollable-list">
                </div>
            
            <div class="modal-actions">
                <button class="btn btn-confirm" style="flex: 2;" onclick="startGame()">Mulai</button>
                <button class="btn btn-cancel" style="flex: 1;" onclick="closeSetupModal()">Batal</button>
            </div>
        </div>
    </div>

    <div id="modal-settings" class="modal hidden">
        <div class="modal-content compact">
            <h2>Pengaturan</h2>
            
            <div class="settings-grid">
                <div class="form-group full-width text-center">
                    <label>Kesulitan: <span id="val-diff-label" class="text-warning">Normal</span></label>
                    <div id="star-rating" class="star-rating">
                        <span class="star" onclick="setDifficulty(1)">★</span>
                        <span class="star" onclick="setDifficulty(2)">★</span>
                        <span class="star" onclick="setDifficulty(3)">★</span>
                        <span class="star" onclick="setDifficulty(4)">★</span>
                        <span class="star" onclick="setDifficulty(5)">★</span>
                    </div>
                    <input type="hidden" id="cfg-difficulty" value="2">
                </div>

                <div class="form-group">
                    <label>BG Menu:</label>
                    <select id="cfg-bg-menu" onchange="updateSettingsUI()" class="modern-input">
                        <option value="bg-default">Default</option>
                        <option value="bg-grid">Cyber</option>
                        <option value="bg-space">Space</option>
                        <option value="bg-retro">Retro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>BG Game:</label>
                    <select id="cfg-bg-game" onchange="updateSettingsUI()" class="modern-input">
                        <option value="bg-default">Default</option>
                        <option value="bg-grid" selected>Cyber</option>
                        <option value="bg-space">Space</option>
                        <option value="bg-retro">Retro</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Time Trial (Menit):</label>
                    <div class="stepper-control">
                        <button class="step-btn" onclick="adjTimer(-1)">-</button>
                        <span id="val-time" class="step-val">5</span>
                        <button class="step-btn" onclick="adjTimer(1)">+</button>
                    </div>
                    <input type="hidden" id="cfg-timer" value="5">
                </div>
                
                <div class="form-group">
                    <label>Target Geo Run:</label>
                    <div class="stepper-control">
                        <button class="step-btn" onclick="adjTarget(-50)">-</button>
                        <span id="val-shape" class="step-val">50</span>
                        <button class="step-btn" onclick="adjTarget(50)">+</button>
                    </div>
                    <input type="hidden" id="cfg-shape" value="50">
                </div>
            </div>
            
            <div class="data-actions">
                <button class="btn-small" onclick="exportData()">⬇ Export</button>
                <button class="btn-small" onclick="importData()">⬆ Import</button>
                <button class="btn-small btn-danger" onclick="resetData()">🗑 Reset</button>
            </div>
            
            <button class="btn btn-cancel full-width-btn" onclick="toggleSettings()">Tutup</button>
        </div>
    </div>

    <div id="screen-gameover" class="screen hidden">
        <h1 style="color:var(--secondary)">Game Over</h1>
        <h2 id="final-score">Skor: 0</h2>
        <p id="final-detail"></p>
        <button class="btn" onclick="goToMenu()">Menu Utama</button>
    </div>

    <div id="game-layer" class="hidden">
        <div class="game-controls">
            <button class="icon-btn btn-abort" onclick="abortGame()">✖</button>
        </div>

        <div id="hud">
            <div id="hud-score">Skor: 0</div>
            <div id="hud-timer">Waktu: 00:00</div>
            <div id="hud-target" style="display:none; color: var(--primary)">Target: 0</div>
            <div id="hud-lives">❤️❤️❤️</div>
        </div>
        
        <div id="hud-combo"></div>
        <div id="toast-container"></div>
        <div id="boss-warning">⚠️ FINAL TARGET ⚠️</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="modal-dialog" class="modal hidden">
        <div class="modal-content compact border-primary">
            <h3 id="dialog-title" style="margin-top:0">Pesan</h3>
            <p id="dialog-msg">...</p>
            <div id="dialog-actions" class="modal-actions"></div>
        </div>
    </div>

    <script src="items.js"></script>
    <script src="object.js"></script>
    <script src="script.js"></script>
</body>
</html>
